<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calque — dessiner sur papier</title>
<style>
:root{--bg:#16181b;--panel:rgba(22,24,27,.88);--ink:#f3f1ec;--mute:#a8a9ab;--accent:#f2c14e;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;left:0;top:0;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none;display:none}
#perm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:20px}
#perm .card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px 20px;max-width:340px;width:100%}
#perm h2{margin:0 0 8px;font-size:19px}
#perm p{margin:0 0 16px;color:var(--mute)}
#perm p.err{color:#ff8a7a}
#perm button{width:100%;font-weight:600;background:var(--accent);color:#1a1405;border-color:var(--accent)}
#grid{position:absolute;inset:0;pointer-events:none;display:none;--g:48px;background-image:linear-gradient(to right,rgba(40,140,255,.8) 1px,transparent 1px),linear-gradient(to bottom,rgba(40,140,255,.8) 1px,transparent 1px);background-size:var(--g) var(--g);background-position:center center}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;z-index:2;pointer-events:none}
#msg p{max-width:30ch;margin:0;color:var(--mute)}
#msg b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;transition:transform .2s}
#bar.hidden{transform:translateY(100%)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
button,label.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:9px 13px;border-radius:10px;cursor:pointer;min-height:40px}
button[aria-pressed=true]{background:var(--accent);color:#1a1405;border-color:var(--accent)}
button.main,label.main{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
input[type=file]{display:none}
input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.lbl{color:var(--mute);min-width:70px}
#toggle{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:6;background:var(--panel);width:44px;padding:0;border-radius:50%;height:44px;font-size:18px}
#lockbadge{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:12px;z-index:6;background:var(--accent);color:#1a1405;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <img id="ov" alt="">
  <div id="grid"></div>
</div>
<div id="msg"><p><b>Ajoutez une image</b>Posez le téléphone au-dessus de votre feuille, choisissez un modèle, puis suivez les traits au crayon.</p></div>
<div id="perm" role="dialog" aria-modal="true" aria-labelledby="permTitle">
  <div class="card">
    <h2 id="permTitle">Autoriser la caméra</h2>
    <p>La caméra sert uniquement à afficher votre feuille derrière l’image. Rien n’est enregistré ni envoyé.</p>
    <p class="err" id="permErr" style="display:none"></p>
    <button id="permBtn">Autoriser la caméra</button>
  </div>
</div>
<div id="lockbadge">Calque verrouillé</div>
<button id="toggle" aria-label="Masquer ou afficher les réglages">☰</button>

<div id="bar">
  <div class="row">
    <label class="btn main" for="file">Choisir une image</label>
    <input id="file" type="file" accept="image/*">
    <button id="lock" aria-pressed="false">Verrouiller</button>
    <button id="reset">Recentrer</button>
  </div>
  <div class="row"><span class="lbl">Opacité</span><input id="op" type="range" min="5" max="100" value="50"></div>
  <div class="row"><span class="lbl">Zoom</span><input id="zoom" type="range" min="-3.9" max="3" step="0.01" value="0"></div>
  <div class="row"><button id="gridbtn" aria-pressed="false" style="min-width:70px">Grille</button><input id="gsize" type="range" min="20" max="160" value="48" aria-label="Taille des cases"></div>
  <div class="row wrap">
    <button id="edge" aria-pressed="false">Contours</button>
    <button id="flip" aria-pressed="false">Miroir</button>
    <button id="r90">Pivoter 90°</button>
    <button id="torch" style="display:none" aria-pressed="false">Lampe</button>
  </div>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var stage=$('stage'), cam=$('cam'), ov=$('ov'), msg=$('msg');
  var S={x:0,y:0,s:1,r:0,f:1,locked:false,edge:false};
  var srcImg=null, edgeURL=null, origURL=null;

  function apply(){
    ov.style.transform='translate('+S.x+'px,'+S.y+'px) rotate('+S.r+'rad) scale('+(S.s*S.f)+','+S.s+')';
    $('zoom').value=Math.log(S.s);
  }
  $('zoom').addEventListener('input',function(){
    if(!srcImg) return;
    S.s=Math.exp(parseFloat(this.value)); apply();
  });
  $('gridbtn').addEventListener('click',function(){
    var on=this.getAttribute('aria-pressed')!=='true';
    this.setAttribute('aria-pressed',on);
    $('grid').style.display=on?'block':'none';
  });
  $('gsize').addEventListener('input',function(){
    $('grid').style.setProperty('--g',this.value+'px');
  });
  function reset(){
    if(!srcImg) return;
    var w=srcImg.naturalWidth, h=srcImg.naturalHeight;
    var vw=innerWidth, vh=innerHeight;
    S.s=Math.min(vw*0.85/w, vh*0.6/h); S.r=0; S.f=1;
    S.x=(vw-w)/2; S.y=(vh-h)/2-30;
    $('flip').setAttribute('aria-pressed','false');
    apply();
  }

  /* --- Caméra --- */
  var track=null;
  function startCam(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      showPerm('Caméra indisponible : ouvrez cette page en HTTPS avec un navigateur récent (Chrome, Safari).');return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})
    .then(function(st){
      cam.srcObject=st; track=st.getVideoTracks()[0];
      $('perm').style.display='none';
      try{var c=track.getCapabilities&&track.getCapabilities(); if(c&&c.torch) $('torch').style.display='';}catch(e){}
      if('wakeLock' in navigator){navigator.wakeLock.request('screen').catch(function(){});}
    })
    .catch(function(e){
      var n=e&&e.name;
      if(n==='NotFoundError'||n==='OverconstrainedError') showPerm('Aucune caméra détectée sur cet appareil.');
      else if(n==='NotReadableError') showPerm('La caméra est utilisée par une autre application. Fermez-la, puis réessayez.');
      else showPerm('Accès refusé. Touchez l’icône à gauche de l’adresse (cadenas ou réglages), autorisez la caméra, puis réessayez.');
    });
  }
  function showErr(t,d){msg.style.display='flex';msg.innerHTML='<p><b>'+t+'</b>'+d+'</p>';}
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && 'wakeLock' in navigator && cam.srcObject){navigator.wakeLock.request('screen').catch(function(){});}
  });

  /* --- Image --- */
  $('file').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    if(origURL) URL.revokeObjectURL(origURL);
    origURL=URL.createObjectURL(f);
    var im=new Image();
    im.onload=function(){
      srcImg=im; edgeURL=null; S.edge=false; $('edge').setAttribute('aria-pressed','false');
      ov.src=origURL; ov.style.display='block';
      ov.style.width=im.naturalWidth+'px'; ov.style.height=im.naturalHeight+'px';
      msg.style.display='none';
      reset(); ov.style.opacity=$('op').value/100;
    };
    im.src=origURL;
  });

  $('op').addEventListener('input',function(){ov.style.opacity=this.value/100});

  /* --- Contours (filtre de Sobel) --- */
  function makeEdges(){
    var max=1200, k=Math.min(1,max/Math.max(srcImg.naturalWidth,srcImg.naturalHeight));
    var w=Math.round(srcImg.naturalWidth*k), h=Math.round(srcImg.naturalHeight*k);
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d'); x.drawImage(srcImg,0,0,w,h);
    var d=x.getImageData(0,0,w,h), p=d.data, g=new Float32Array(w*h), i, j;
    for(i=0;i<w*h;i++){j=i*4; g[i]=(p[j]*.299+p[j+1]*.587+p[j+2]*.114)*(p[j+3]/255)+255*(1-p[j+3]/255);}
    var out=x.createImageData(w,h), o=out.data;
    for(var yy=1;yy<h-1;yy++)for(var xx=1;xx<w-1;xx++){
      var a=yy*w+xx;
      var gx=-g[a-w-1]-2*g[a-1]-g[a+w-1]+g[a-w+1]+2*g[a+1]+g[a+w+1];
      var gy=-g[a-w-1]-2*g[a-w]-g[a-w+1]+g[a+w-1]+2*g[a+w]+g[a+w+1];
      var m=Math.min(255,Math.sqrt(gx*gx+gy*gy)*1.2), q=a*4;
      o[q]=230;o[q+1]=30;o[q+2]=70;o[q+3]=m>30?Math.min(255,m*1.6):0;
    }
    x.putImageData(out,0,0);
    return c.toDataURL('image/png');
  }
  $('edge').addEventListener('click',function(){
    if(!srcImg) return;
    S.edge=!S.edge; this.setAttribute('aria-pressed',S.edge);
    if(S.edge){ if(!edgeURL) edgeURL=makeEdges(); ov.src=edgeURL; }
    else ov.src=origURL;
  });

  /* --- Boutons --- */
  $('flip').addEventListener('click',function(){
    S.f*=-1; this.setAttribute('aria-pressed',S.f<0); apply();
  });
  $('r90').addEventListener('click',function(){S.r+=Math.PI/2; apply();});
  $('reset').addEventListener('click',reset);
  $('lock').addEventListener('click',function(){
    S.locked=!S.locked; this.setAttribute('aria-pressed',S.locked);
    this.textContent=S.locked?'Déverrouiller':'Verrouiller';
    $('lockbadge').style.display=S.locked?'block':'none';
  });
  $('torch').addEventListener('click',function(){
    var on=this.getAttribute('aria-pressed')!=='true';
    track.applyConstraints({advanced:[{torch:on}]}).then(function(){$('torch').setAttribute('aria-pressed',on)}).catch(function(){});
  });
  $('toggle').addEventListener('click',function(){$('bar').classList.toggle('hidden')});

  /* --- Gestes : 1 doigt = déplacer, 2 doigts = zoom + rotation --- */
  var ptrs={};
  function pts(){return Object.keys(ptrs).map(function(k){return ptrs[k]})}
  stage.addEventListener('pointerdown',function(e){
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
  });
  stage.addEventListener('pointermove',function(e){
    if(!ptrs[e.pointerId]) return;
    var before=pts().map(function(p){return{x:p.x,y:p.y}});
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(S.locked||!srcImg) return;
    var after=pts();
    if(after.length===1){
      S.x+=after[0].x-before[0].x; S.y+=after[0].y-before[0].y;
    } else if(after.length>=2){
      var b0=before[0],b1=before[1],a0=after[0],a1=after[1];
      var db=Math.hypot(b1.x-b0.x,b1.y-b0.y)||1, da=Math.hypot(a1.x-a0.x,a1.y-a0.y)||1;
      var ang=Math.atan2(a1.y-a0.y,a1.x-a0.x)-Math.atan2(b1.y-b0.y,b1.x-b0.x);
      var cb={x:(b0.x+b1.x)/2,y:(b0.y+b1.y)/2}, ca={x:(a0.x+a1.x)/2,y:(a0.y+a1.y)/2};
      var ratio=da/db;
      /* centre visuel de l'image */
      var cx=S.x+srcImg.naturalWidth/2, cy=S.y+srcImg.naturalHeight/2;
      var vx=cx-cb.x, vy=cy-cb.y, cs=Math.cos(ang), sn=Math.sin(ang);
      var nx=ca.x+(vx*cs-vy*sn)*ratio, ny=ca.y+(vx*sn+vy*cs)*ratio;
      S.x=nx-srcImg.naturalWidth/2; S.y=ny-srcImg.naturalHeight/2;
      S.s=Math.max(0.02,Math.min(20,S.s*ratio));
      S.r+=ang;
    }
    apply();
  });
  function up(e){delete ptrs[e.pointerId]}
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);

  /* Molette sur ordinateur */
  stage.addEventListener('wheel',function(e){
    if(S.locked||!srcImg) return; e.preventDefault();
    S.s=Math.max(0.02,Math.min(20,S.s*(e.deltaY<0?1.06:0.94))); apply();
  },{passive:false});

  function showPerm(err){
    $('perm').style.display='flex';
    var el=$('permErr'); el.textContent=err||''; el.style.display=err?'block':'none';
    $('permBtn').textContent=err?'Réessayer':'Autoriser la caméra';
  }
  $('permBtn').addEventListener('click',startCam);
  showPerm('');
  /* Si l’autorisation est déjà accordée, on démarre sans redemander */
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'camera'}).then(function(r){ if(r.state==='granted') startCam(); }).catch(function(){});
  }
})();
</script>
</body>
</html>
